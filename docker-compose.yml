# Local AWS stack: DynamoDB Local + table bootstrap + the Rust API as a plain HTTP server.
#   docker compose up --build        → API on http://localhost:3000, DynamoDB Local on :8000
# Shared settings for the API and the reminders worker.
x-local-api: &local-api
  # DynamoDB Local accepts any credentials. To try Bedrock AI locally, export real AWS
  # credentials in your shell before `docker compose up` (they're only used for Bedrock).
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_REGION: ${AWS_REGION:-us-west-2}
  DDB_ENDPOINT: http://dynamodb:8000
  TABLE_NAME: training-tracker
  # Local-only keys, never used in AWS (there they are generated into Secrets Manager).
  JWT_SECRET: local-dev-only-secret-change-me-0123456789abcdef
  VAPID_PRIVATE_KEY: OAlu4MsSSG4eCtmi7J04t3ooACp5Hi7_A84iSqPEdfU
  VAPID_SUBJECT: mailto:dev@localhost.test
  RUST_LOG: info

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports: ["8000:8000"]
    volumes: ["ddb-data:/home/dynamodblocal/data"]

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb]
    environment: &fake-aws
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1 && break; sleep 1; done
        E="--endpoint-url http://dynamodb:8000"
        aws dynamodb describe-table --table-name training-tracker $$E >/dev/null 2>&1 \
          || aws dynamodb create-table $$E --table-name training-tracker \
               --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
               --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
               --billing-mode PAY_PER_REQUEST >/dev/null
        # Reminders index (added to tables created before it existed).
        aws dynamodb describe-table --table-name training-tracker $$E --query 'Table.GlobalSecondaryIndexes[].IndexName' --output text | grep -q gsi1 \
          || aws dynamodb update-table $$E --table-name training-tracker \
               --attribute-definitions AttributeName=gsi1pk,AttributeType=S AttributeName=gsi1sk,AttributeType=S \
               --global-secondary-index-updates '[{"Create":{"IndexName":"gsi1","KeySchema":[{"AttributeName":"gsi1pk","KeyType":"HASH"},{"AttributeName":"gsi1sk","KeyType":"RANGE"}],"Projection":{"ProjectionType":"KEYS_ONLY"}}}]' >/dev/null
        echo "table ready"

  # Creates the default test user (idempotent), then exits.
  seed-user:
    build: ./api
    command: ["api", "create-user"]
    depends_on:
      dynamodb-init: { condition: service_completed_successfully }
    environment:
      <<: *fake-aws
      DDB_ENDPOINT: http://dynamodb:8000
      TABLE_NAME: training-tracker
      CREATE_USER_EMAIL: test@mailinator.com
      CREATE_USER_PASSWORD: "123456789"

  api:
    build: ./api
    depends_on:
      seed-user: { condition: service_completed_successfully }
    environment:
      <<: *local-api
      CORS_ORIGINS: "*"
      PORT: "3000"
    ports: ["3000:3000"]

  # Sends routine reminders (checks every minute).
  reminders:
    build: ./api
    depends_on:
      seed-user: { condition: service_completed_successfully }
    environment:
      <<: *local-api
      TT_MODE: reminders

volumes:
  ddb-data:
